spring:
  application:
    name: auth-service

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  datasource:
    url: jdbc:h2:mem:authdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# JWT 설정
jwt:
  secret-key: ${JWT_SECRET_KEY:your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-please-change-this-in-production-environment}
  expiration-hours: 24

# CORS 설정 (프론트엔드와 협업 시 필요)
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# OAuth2 소셜 로그인 설정
# 실제 운영 시 각 소셜 플랫폼에서 Client ID와 Secret을 발급받아 설정해야 합니다
spring.security.oauth2:
  client:
    registration:
      # Google OAuth2 설정
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
        scope:
          - email
          - profile

      # Kakao OAuth2 설정
      kakao:
        client-id: ${KAKAO_CLIENT_ID}
        client-secret: ${KAKAO_CLIENT_SECRET}
        client-authentication-method: client_secret_post
        authorization-grant-type: authorization_code
        redirect-uri: http://localhost:8080/login/oauth2/code/kakao
        scope:
          - profile_nickname
          - account_email
        client-name: Kakao

      # Naver OAuth2 설정
      naver:
        client-id: ${NAVER_CLIENT_ID}
        client-secret: ${NAVER_CLIENT_SECRET}
        client-authentication-method: client_secret_post
        authorization-grant-type: authorization_code
        redirect-uri: http://localhost:8080/login/oauth2/code/naver
        scope:
          - name
          - email
        client-name: Naver

    provider:
      kakao:
        authorization-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        user-info-uri: https://kapi.kakao.com/v2/user/me
        user-name-attribute: id

      naver:
        authorization-uri: https://nid.naver.com/oauth2.0/authorize
        token-uri: https://nid.naver.com/oauth2.0/token
        user-info-uri: https://openapi.naver.com/v1/nid/me
        user-name-attribute: response
